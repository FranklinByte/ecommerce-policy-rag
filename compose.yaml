name: ecommerce-policy-rag
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Qdrant is reachable only on the internal Compose network.
  app:
    build: .
    image: ecommerce-policy-rag:0.1.0
    ports:
      - "127.0.0.1:${POLICY_RAG_HTTP_PORT:-8011}:8010"
    environment:
      POLICY_RAG_QDRANT_URL: http://qdrant:6333
      POLICY_RAG_TORCH_THREADS: "4"
    volumes:
      - index_data:/app/data/index
      - model_cache:/app/model-cache
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
volumes:
  qdrant_data:
  index_data:
  model_cache:

schema_version: '1'
dataset: data/eval/queries.jsonl
strategies: [structure, sliding]
modes: [bm25, dense, hybrid, hybrid_rerank]
top_k: 5
candidate_k: 10
chunk_size: 520
chunk_overlap: 80
rrf_k: 60
repetitions: 1
warmup_query: 华为配件保修期限
annotation: AI-assisted fixed regression; not independently human-reviewed
retrieval_unit: unique_document_rank_deduplicated_from_top_5_chunks
generation_backend: extractive-v1
thresholds:
  sparse: 0.75
  dense: 0.60
  cross_encoder: 0.42
threshold_selection: engineering defaults frozen before first benchmark; no claim of calibration

<body>
  <main>
    <h1>星云商城电子产品售后规则 v1</h1>
    <h2>适用期</h2>
    <p>本合成规则仅用于 2024 年版本过滤测试，适用于星云商城自营手机和平板。</p>
    <h2>无理由退货</h2>
    <p>签收后 7 个自然日内，商品未激活、未拆除一次性封条、外观无损且配件齐全时，可以申请无理由退货。</p>
    <h2>质量问题换货</h2>
    <p>签收后 15 个自然日内，型号 NEBULA-P1 或 NEBULA-T1 经检测存在硬件性能故障，可以申请换货。</p>
    <h2>排除条件</h2>
    <p>激活设备、缺少序列号标签、人为进液或擅自拆机不适用无理由退货。</p>
  </main>
</body>
</html>
